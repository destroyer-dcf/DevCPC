# ==============================================================================
# Proyecto ASM - DevCPC
# ==============================================================================

PROJECT_NAME="asm"

# ==============================================================================
# COMPILACIÓN ASM
# ==============================================================================
# LOADADDR y SOURCE son dependientes: deben definirse ambos o ninguno

ASM_PATH="src"               # Directorio con los .asm o archivo .asm directamente
LOADADDR=0x1200             # Dirección de carga (hex)
SOURCE="main"               # Archivo fuente (sin extensión .asm)
TARGET="devcpc"             # Nombre del binario generado (sin extensión)

# ==============================================================================
# CÓDIGO FUENTE ADICIONAL (opcional)
# ==============================================================================

# Archivos RAW (sin encabezado AMSDOS)
#RAW_PATH="src/raw"

# Archivos BASIC (.bas → DSK automáticamente)
#BASIC_PATH="src/basic/code"

# ==============================================================================
# GRÁFICOS (PNG → ASM/SCN)
# ==============================================================================

# Sprites PNG → ASM (ambas son obligatorias si se usan)
#SPRITES_PATH="src/assets/sprites"
#SPRITES_OUT_FILE="src/sprites.asm"
#MODE=1   # 0=16 colores · 1=4 colores · 2=2 colores

# Pantallas de carga PNG → SCN (se añaden al DSK en &C000)
#LOADER_SCREEN="src/assets/screen"

# ==============================================================================
# SALIDA
# ==============================================================================

OBJ_DIR="obj"
DIST_DIR="dist"
DSK="${PROJECT_NAME}.dsk"

# Cinta CDT (opcional)
CDT="${PROJECT_NAME}.cdt"
CDT_FILES="${TARGET}.bin"

# Cartucho CPR (ambas son obligatorias si se usan)
CPR="${PROJECT_NAME}.cpr"
CPR_EXECUTE="${TARGET}.bin"

# ==============================================================================
# EMULADOR
# ==============================================================================

EMULATOR_TYPE="rvm"   # rvm (RetroVirtualMachine)
RVM_PATH="/Applications/Retro Virtual Machine 2.app/Contents/MacOS/Retro Virtual Machine 2"
CPC_MODEL=6128               # 464 | 664 | 6128
RUN_FILE="${TARGET}.bin"
